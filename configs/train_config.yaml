# Cấu hình Huấn luyện (Gói G2 — Training)
# Single source of truth cho fine-tuning mô hình DistilBERT phân loại nhị phân IMDb

training:
  output_dir: results/runs
  run_name: g2-training
  learning_rate: 2.0e-5
  per_device_train_batch_size: 16
  per_device_eval_batch_size: 32
  num_train_epochs: 3
  weight_decay: 0.01
  warmup_steps: 50
  max_grad_norm: 1.0
  seed: 42
  logging_steps: 10
  eval_strategy: epoch
  save_strategy: epoch
  save_total_limit: 2
  load_best_model_at_end: true
  metric_for_best_model: f1
  greater_is_better: true
  early_stopping_patience: 2
  early_stopping_threshold: 0.001
  use_cpu: true
  report_to: []

data:
  # Cắt mẫu để ước lượng thời gian hoặc debug; null = chạy toàn bộ
  max_train_samples: null
  max_eval_samples: null
  # G2 TUYỆT ĐỐI không dùng test (test được khóa riêng cho G3 Eval)
  include_test: false

model_config_path: configs/model_config.yaml
